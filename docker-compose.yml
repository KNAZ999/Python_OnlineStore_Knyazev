version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data/

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000  # ← заменили на runserver
    env_file:
      - .env
    volumes:
      - .:/site_Knyazev  # монтируем для горячей перезагрузки
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db-data: