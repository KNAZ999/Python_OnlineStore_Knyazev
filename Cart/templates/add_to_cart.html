<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить в корзину</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 0;
        }
        .cart-form-container {
            max-width: 600px;
            margin: auto;
            padding: 2rem;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        .form-header {
            text-align: center;
            margin-bottom: 2rem;
            color: #2c3e50;
        }
        .form-header h1 {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .form-header p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            font-weight: 600;
            color: #34495e;
        }
        .btn-submit {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(238, 90, 82, 0.4);
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(238, 90, 82, 0.6);
        }
        .btn-secondary {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }
        .btn-secondary:hover {
            color: #2980b9;
        }
        .icon {
            color: #ff6b6b;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cart-form-container">
            <div class="form-header">
                <h1><i class="fas fa-shopping-cart icon"></i> Добавить в корзину</h1>
                <p>Укажите количество товара для покупки</p>
            </div>

            <form method="post" action="{% url 'Cart:add_to_cart' %}">
                {% csrf_token %}

                {% for field in form %}
                    <div class="form-group">
                        <label for="{{ field.id_for_label }}">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.help_text %}
                            <small class="text-muted">{{ field.help_text }}</small>
                        {% endif %}
                        {% if field.errors %}
                            <div class="text-danger">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-submit">
                    <i class="fas fa-plus-circle"></i> Добавить в корзину
                </button>
            </form>

            <a href="{% url 'Products:product_list' %}" class="btn-secondary">
                <i class="fas fa-arrow-left"></i> Вернуться в каталог
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
